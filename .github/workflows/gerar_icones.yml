name: Gerar Icones do App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Encontrar a pasta do projeto automaticamente
        id: find_project
        run: |
          echo "Procurando pelo arquivo pubspec.yaml..."
          # Procura em qualquer lugar, ignorando pastas de build
          DIR=$(find . -name "pubspec.yaml" -not -path "*/build/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$DIR" ]; then
            echo "::error::Arquivo pubspec.yaml NAO ENCONTRADO no repositorio!"
            echo "Verifique se os arquivos do Flutter foram enviados corretamente."
            ls -la
            exit 1
          else
            echo "Projeto Flutter encontrado na pasta: $DIR"
            echo "WORKDIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: ${{ env.WORKDIR }}

      - name: Gerar Icones
        run: flutter pub run flutter_launcher_icons:main
        working-directory: ${{ env.WORKDIR }}

      - name: Commit e Push dos icones gerados
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Gerando icones automaticamente"
          git push